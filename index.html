<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BT-Earn - Earn Bitcoin Rewards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 400px;
            max-width: 90%;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 32px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
        }

        .btn-google {
            background: #db4437;
            color: white;
        }

        .btn-link {
            background: none;
            color: #667eea;
            text-decoration: underline;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #ddd;
        }

        .divider span {
            background: white;
            padding: 0 15px;
            position: relative;
            color: #666;
        }

        .error-message {
            color: #e53e3e;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="authContainer" class="auth-container">
        <div class="logo">
            <h1>💰 BT-Earn</h1>
            <p>Earn Bitcoin by completing tasks</p>
        </div>
        
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        
        <button class="btn-primary" onclick="signUp()">Sign Up</button>
        <button class="btn-primary" onclick="signIn()">Login</button>
        <button class="btn-google" onclick="signInWithGoogle()">Continue with Google</button>
        <button class="btn-link" onclick="resetPassword()">Forgot Password?</button>
        
        <div id="errorMsg" class="error-message"></div>
        
        <div class="divider">
            <span>Join thousands of earners</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, sendPasswordResetEmail, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        // YOUR CORRECT FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyDjv41yKM3ViDPbf9TQmiVKgXKkQn88uZE",
            authDomain: "bt-earn-986f3.firebaseapp.com",
            projectId: "bt-earn-986f3",
            storageBucket: "bt-earn-986f3.firebasestorage.app",
            messagingSenderId: "101980248199",
            appId: "1:101980248199:web:772642b9ebe807f18f0022",
            measurementId: "G-TXSM16GJQJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        function showError(message) {
            document.getElementById('errorMsg').textContent = message;
            setTimeout(() => {
                document.getElementById('errorMsg').textContent = '';
            }, 5000);
        }

        window.signUp = () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                showError("Please enter email and password");
                return;
            }
            
            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    sendEmailVerification(userCredential.user);
                    alert("✅ Account created! Verification email sent. Please verify before logging in.");
                    document.getElementById('email').value = '';
                    document.getElementById('password').value = '';
                })
                .catch((error) => {
                    let message = error.message;
                    if (error.code === 'auth/email-already-in-use') {
                        message = "Email already in use. Please login instead.";
                    } else if (error.code === 'auth/weak-password') {
                        message = "Password should be at least 6 characters.";
                    }
                    showError(message);
                });
        };

        window.signIn = () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                showError("Please enter email and password");
                return;
            }
            
            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    if (!userCredential.user.emailVerified) {
                        alert("⚠️ Please verify your email first. Check your inbox!");
                        auth.signOut();
                    } else {
                        alert("✅ Login successful! Welcome to BT-Earn!");
                        window.location.href = "dashboard.html"; // You'll create this
                    }
                })
                .catch((error) => {
                    let message = error.message;
                    if (error.code === 'auth/invalid-credential') {
                        message = "Invalid email or password.";
                    } else if (error.code === 'auth/too-many-requests') {
                        message = "Too many attempts. Try again later.";
                    }
                    showError(message);
                });
        };

        window.signInWithGoogle = () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    alert("✅ Google login successful! Welcome to BT-Earn!");
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    let message = error.message;
                    if (error.code === 'auth/popup-closed-by-user') {
                        message = "Popup closed. Please try again.";
                    }
                    showError(message);
                });
        };

        window.resetPassword = () => {
            const email = prompt("Enter your email address:");
            if (email) {
                sendPasswordResetEmail(auth, email)
                    .then(() => alert("📧 Password reset email sent! Check your inbox."))
                    .catch((error) => showError(error.message));
            }
        };
    </script>
</body>
</html>
