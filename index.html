<!DOCTYPE html>
<html>
<head>
    <title>BT-Earn Login</title>
</head>
<body>
    <h2>BT-Earn - Sign Up / Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="signUp()">Sign Up</button>
    <button onclick="signIn()">Login</button>
    <button onclick="signInWithGoogle()">Google Login</button>
    <button onclick="resetPassword()">Forgot Password?</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, sendPasswordResetEmail, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const config = {
            apiKey: "AIzaSyDv4lyKM3vIDPbf9TQmivKgXkKQn88uZE",
            authDomain: "bt-earn-986f3.firebaseapp.com",
            projectId: "bt-earn-986f3",
            storageBucket: "bt-earn-986f3.firebasestorage.app"
        };

        const app = initializeApp(config);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.signUp = () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    sendEmailVerification(userCredential.user);
                    alert("Account created! Check your email to verify.");
                })
                .catch((error) => alert(error.message));
        };

        window.signIn = () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, password)
                .then(() => alert("Logged in!"))
                .catch((error) => alert(error.message));
        };

        window.signInWithGoogle = () => {
            signInWithPopup(auth, provider)
                .then(() => alert("Google login successful!"))
                .catch((error) => alert(error.message));
        };

        window.resetPassword = () => {
            const email = prompt("Enter your email:");
            sendPasswordResetEmail(auth, email)
                .then(() => alert("Reset email sent!"))
                .catch((error) => alert(error.message));
        };
    </script>
</body>
</html>
