<!DOCTYPE html>
<html>
<head>
<title>BT-EARN ADMIN</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:15px}
.card{background:#171717;padding:20px;border-radius:12px;border:1px solid #f0b90b;margin-bottom:15px}
input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none;box-sizing:border-box}
input,select{background:#2a2a2a;color:#fff}
button{background:#f0b90b;font-weight:bold}
button.red{background:#ff3333;color:#fff}
.user{background:#222;padding:10px;margin:5px 0;border-radius:6px;display:flex;justify-content:space-between;font-size:13px}
</style>
</head>
<body>
<h2>BT-EARN ADMIN 🔐</h2>
<div class="card">
<input id="email" placeholder="User Email e.g user@gmail.com">
<input id="amount" type="number" placeholder="Amount e.g 100">
<select id="currency"><option value="usdt">USDT</option><option value="btc">BTC</option><option value="eth">ETH</option><option value="bnb">BNB</option><option value="sol">SOL</option></select>
<button onclick="addBal()">ADD BALANCE ✅</button>
<button class="red" onclick="reduceBal()">REDUCE ❌</button>
<p id="msg"></p>
</div>
<div class="card">
<button onclick="loadUsers()">🔄 Load All Users</button>
<div id="users"></div>
</div>
<script>
const API="https://api.bt-earn.xyz";
async function addBal(){
 const email=document.getElementById('email').value;
 const amount=document.getElementById('amount').value;
 const currency=document.getElementById('currency').value;
 const res=await fetch(API+'/api/admin/add-balance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,amount,currency})});
 const d=await res.json(); document.getElementById('msg').innerText=d.success?"✅ Added!":"❌ "+d.error; loadUsers();
}
async function reduceBal(){
 const email=document.getElementById('email').value;
 const amount=document.getElementById('amount').value;
 const currency=document.getElementById('currency').value;
 const res=await fetch(API+'/api/admin/reduce-balance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,amount,currency})});
 const d=await res.json(); document.getElementById('msg').innerText=d.success?"✅ Reduced!":"❌ "+d.error; loadUsers();
}
async function loadUsers(){
 const res=await fetch(API+'/api/admin/users'); const users=await res.json();
 document.getElementById('users').innerHTML=users.map(u=>`<div class="user"><span>${u.email}</span><span><b>${u.balance} USDT</b></span></div>`).join('');
}
</script>
</body>
</html>
